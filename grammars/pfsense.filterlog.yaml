# pfSense / OPNsense -- filterlog.
# Family: csv. Included deliberately: it is the one perimeter firewall a team
# can actually run in a VM for free, so it is the source a judge is most
# likely to arrive with.
id: pfsense.filterlog
version: 2.0.0
vendor: Netgate
product: pfSense
title: pfSense filterlog
family: csv

signature:
  must: ["filterlog"]
  weight: 0.95

pipeline:
  - syslog: auto
    optional: true
  - prefix: "^filterlog(?:\\[\\d+\\])?:\\s*"
  - columns:
      - rule_number
      - sub_rule
      - anchor
      - tracker
      - interface
      - reason
      - action
      - direction
      - ip_version
      - tos
      - ecn
      - ttl
      - packet_id
      - fragment_offset
      - flags
      - protocol_id
      - protocol
      - length
      - source_address
      - destination_address
      - source_port
      - destination_port

coerce:
  source_port: int
  destination_port: int
  length: int
  ttl: int

# The payload carries no timestamp of its own, but the syslog envelope does --
# and `log_time` is already extracted by the syslog step above. Discarding it
# and falling back to receipt time would throw away the device's own view of
# when the event happened, which is exactly the field an investigator needs to
# reason about clock skew.
clock:
  field: log_time
  formats: [bsd]
  zone: UTC

emit:
  class: 4001
  category: 4
  const: {activity_id: 6}
  fields:
    src_endpoint.ip: source_address
    src_endpoint.port: source_port
    src_endpoint.interface_name: interface
    dst_endpoint.ip: destination_address
    dst_endpoint.port: destination_port
    connection_info.protocol_name: protocol
    traffic.bytes: length
    firewall_rule.uid: rule_number
    device.hostname: log_host
  enums:
    disposition_id:
      source: action
      table: {pass: 1, block: 2, reject: 2, rdr: 1, nat: 1}
      default: 99
      keep: disposition_orig
    connection_info.direction_id:
      source: direction
      table: {in: 1, out: 2}
      default: 0
      keep: direction_orig
